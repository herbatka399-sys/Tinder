<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mój Tinder</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    h1 {
      margin-bottom: 20px;
      color: #fe3c72;
      font-size: 28px;
    }

    .card-container {
      width: 340px;
      height: 520px;
      position: relative;
    }

    .card {
      position: absolute;
      width: 100%;
      height: 100%;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      overflow: hidden;
      cursor: grab;
      transition: transform 0.3s ease, opacity 0.3s ease;
      user-select: none;
    }

    .card img {
      width: 100%;
      height: 75%;
      object-fit: cover;
      pointer-events: none;
    }

    .card-info {
      padding: 16px 20px;
    }

    .card-info h2 {
      font-size: 24px;
      margin-bottom: 4px;
    }

    .card-info p {
      color: #666;
      font-size: 15px;
    }

    .buttons {
      display: flex;
      gap: 30px;
      margin-top: 30px;
    }

    .btn {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: none;
      font-size: 28px;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(0,0,0,0.15);
      transition: transform 0.2s;
    }

    .btn:active {
      transform: scale(0.9);
    }

    .btn-nope {
      background: white;
      color: #ff4458;
      border: 3px solid #ff4458;
    }

    .btn-like {
      background: white;
      color: #2dd36f;
      border: 3px solid #2dd36f;
    }

    .stamp {
      position: absolute;
      top: 40px;
      font-size: 40px;
      font-weight: 800;
      padding: 8px 16px;
      border: 5px solid;
      border-radius: 8px;
      opacity: 0;
      transform: rotate(-20deg);
      pointer-events: none;
    }

    .stamp.like {
      right: 30px;
      color: #2dd36f;
      border-color: #2dd36f;
    }

    .stamp.nope {
      left: 30px;
      color: #ff4458;
      border-color: #ff4458;
    }

    .empty {
      text-align: center;
      color: #888;
      font-size: 20px;
      display: none;
    }
  </style>
</head>
<body>

  <h1>Mój Tinder 🔥</h1>

  <div class="card-container" id="cardContainer"></div>

  <div class="empty" id="emptyMessage">
    Koniec zdjęć 😅<br>Odśwież stronę, żeby zacząć od nowa
  </div>

  <div class="buttons">
    <button class="btn btn-nope" onclick="swipe('left')">✕</button>
    <button class="btn btn-like" onclick="swipe('right')">♥</button>
  </div>

  <script>
    // ============================================
    // STAŁY PROFIL
    // ============================================
    const profile = {
      name: "Waldemar Mazurek",
      age: 49,
      bio: "Karate i samochody marki BMW"
    };

    // Twoje zdjęcia
    const photos = [
      "orca-image--1220504967.jpeg.jpeg",
      "orca-image-1046788928.jpeg.jpeg",
      "orca-image--441459825.jpeg.jpeg",
      "orca-image-911238091.jpeg.jpeg",
      "orca-image-951352849.jpeg.jpeg",
      "orca-image-1923733281.jpeg.jpeg",
      "orca-image--1483105232.jpeg.jpeg",
      "orca-image-883240692.jpeg.jpeg",
      "orca-image--1803540496.jpeg.jpeg",
      "orca-image--950828909.jpeg.jpeg",
      "orca-image--2078740239.jpeg.jpeg",
      "orca-image-2025152550.jpeg.jpeg",
      "orca-image--1027457079.jpeg.jpeg",
      "orca-image--113872463.jpeg.jpeg",
      "orca-image--1572057243.jpeg.jpeg",
      "orca-image-5185934.jpeg.jpeg",
      "orca-image-630356524.jpeg.jpeg",
      "orca-image--1701457680.jpeg.jpeg"
    ];

    let currentIndex = 0;
    let isDragging = false;
    let startX = 0;
    let currentX = 0;

    const container = document.getElementById('cardContainer');
    const emptyMsg = document.getElementById('emptyMessage');

    function createCard(photoUrl, index) {
      const card = document.createElement('div');
      card.className = 'card';
      card.style.zIndex = photos.length - index;

      card.innerHTML = `
        <img src="\( {photoUrl}" alt=" \){profile.name}">
        <div class="card-info">
          <h2>${profile.name}, ${profile.age}</h2>
          <p>${profile.bio}</p>
        </div>
        <div class="stamp like">LIKE</div>
        <div class="stamp nope">NOPE</div>
      `;

      card.addEventListener('mousedown', startDrag);
      card.addEventListener('touchstart', startDrag, {passive: true});

      return card;
    }

    function renderCards() {
      container.innerHTML = '';
      if (currentIndex >= photos.length) {
        emptyMsg.style.display = 'block';
        return;
      }
      emptyMsg.style.display = 'none';

      for (let i = currentIndex; i < Math.min(currentIndex + 2, photos.length); i++) {
        const card = createCard(photos[i], i - currentIndex);
        container.appendChild(card);
      }
    }

    function startDrag(e) {
      isDragging = true;
      startX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
      const card = e.currentTarget;
      card.style.transition = 'none';

      document.addEventListener('mousemove', onDrag);
      document.addEventListener('mouseup', endDrag);
      document.addEventListener('touchmove', onDrag, {passive: true});
      document.addEventListener('touchend', endDrag);
    }

    function onDrag(e) {
      if (!isDragging) return;
      currentX = (e.type.includes('mouse') ? e.clientX : e.touches[0].clientX) - startX;
      const card = container.querySelector('.card');
      if (!card) return;

      const rotate = currentX * 0.1;
      card.style.transform = `translateX(\( {currentX}px) rotate( \){rotate}deg)`;

      const likeStamp = card.querySelector('.stamp.like');
      const nopeStamp = card.querySelector('.stamp.nope');

      if (currentX > 50) {
        likeStamp.style.opacity = Math.min(currentX / 100, 1);
        nopeStamp.style.opacity = 0;
      } else if (currentX < -50) {
        nopeStamp.style.opacity = Math.min(-currentX / 100, 1);
        likeStamp.style.opacity = 0;
      } else {
        likeStamp.style.opacity = 0;
        nopeStamp.style.opacity = 0;
      }
    }

    function endDrag() {
      if (!isDragging) return;
      isDragging = false;

      const card = container.querySelector('.card');
      if (!card) return;

      document.removeEventListener('mousemove', onDrag);
      document.removeEventListener('mouseup', endDrag);
      document.removeEventListener('touchmove', onDrag);
      document.removeEventListener('touchend', endDrag);

      if (Math.abs(currentX) > 120) {
        const direction = currentX > 0 ? 'right' : 'left';
        flyAway(card, direction);
      } else {
        card.style.transition = 'transform 0.3s ease';
        card.style.transform = 'translateX(0) rotate(0)';
        card.querySelector('.stamp.like').style.opacity = 0;
        card.querySelector('.stamp.nope').style.opacity = 0;
      }
      currentX = 0;
    }

    function flyAway(card, direction) {
      const flyX = direction === 'right' ? 1000 : -1000;
      card.style.transition = 'transform 0.4s ease, opacity 0.4s ease';
      card.style.transform = `translateX(\( {flyX}px) rotate( \){direction === 'right' ? 30 : -30}deg)`;
      card.style.opacity = '0';

      setTimeout(() => {
        currentIndex++;
        renderCards();
      }, 300);
    }

    function swipe(direction) {
      const card = container.querySelector('.card');
      if (!card) return;
      flyAway(card, direction);
    }

    renderCards();
  </script>
</body>
</html>
