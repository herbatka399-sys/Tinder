<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mój Tinder</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    h1 {
      margin-bottom: 20px;
      color: #fe3c72;
      font-size: 28px;
    }

    .card-container {
      width: 340px;
      height: 520px;
      position: relative;
    }

    .card {
      position: absolute;
      width: 100%;
      height: 100%;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      overflow: hidden;
      cursor: grab;
      transition: transform 0.3s ease, opacity 0.3s ease;
      user-select: none;
    }

    .card img {
      width: 100%;
      height: 75%;
      object-fit: cover;
      pointer-events: none;
    }

    .card-info {
      padding: 16px 20px;
    }

    .card-info h2 {
      font-size: 24px;
      margin-bottom: 4px;
    }

    .card-info p {
      color: #666;
      font-size: 15px;
    }

    .buttons {
      display: flex;
      gap: 30px;
      margin-top: 30px;
    }

    .btn {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: none;
      font-size: 28px;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(0,0,0,0.15);
      transition: transform 0.2s;
    }

    .btn:active {
      transform: scale(0.9);
    }

    .btn-nope {
      background: white;
      color: #ff4458;
      border: 3px solid #ff4458;
    }

    .btn-like {
      background: white;
      color: #2dd36f;
      border: 3px solid #2dd36f;
    }
